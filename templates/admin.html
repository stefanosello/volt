<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volt — Inbox</title>
<style>body{font:15px/1.5 system-ui;max-width:65rem;margin:2rem auto;padding:1rem}article{padding:1.2rem;margin:1rem 0;border:1px solid #ddd;border-radius:.5rem}input,button{padding:.5rem}pre{white-space:pre-wrap;font:inherit;background:#f4f5f6;padding:1rem}</style>
<h1>Incoming requests</h1>{% for job in jobs %}<article><strong>{{ services[job['service']] }}</strong> · {{job['status']}} · {{job['created_at']}}<p>{{job['name']}} · {{job['contact']}} · {{job['postcode']}}</p><p>{{job['description']}}</p><p><strong>AI draft (not verified):</strong></p><pre>{{job['assessment']}}</pre>
<form action="{{url_for('review',job_id=job['id'])}}" method="post"><input type="hidden" name="csrf" value="{{csrf_for(job['id'])}}"><label>Technician-reviewed price (€; optional) <input name="price_eur" type="number" min="1" max="1000000" value="{{job['price_eur'] or ''}}"></label> <button>Mark reviewed</button></form></article>{% else %}<p>No requests yet.</p>{% endfor %}</html>
